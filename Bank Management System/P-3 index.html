
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Management System</title>
    <link rel="stylesheet" href="P-3 style.css">
</head>

<body>

    <div class="container">
        <h1>Bank Management System</h1>

        <div class="card">
            <h2>Account Details</h2>

            <label>Account Holder Name</label>
            <input type="text" id="accountHolder" placeholder="Enter name">

            <label>Initial Balance</label>
            <input type="number" id="initialBalance" placeholder="Enter balance">

            <label>Account Type</label>
            <select id="accountType">
                <option value="bank">Bank Account</option>
                <option value="saving">Saving Bank Account</option>
            </select>

            <div id="interestSection" class="hidden">
                <label>Interest Rate (%)</label>
                <input type="number" id="interestRate" placeholder="Enter interest rate">
            </div>

            <button onclick="createAccount()">Create Account</button>
        </div>


        <div id="accountSection" class="card hidden">

            <h2>Account Information</h2>

            <p><strong>Account Holder:</strong> <span id="displayName"></span></p>

            <p><strong>Account Type:</strong> <span id="displayType"></span></p>

            <p id="displayInterest"></p>

            <p class="balance">
                Balance: ₹<span id="displayBalance">0</span>
            </p>

            <div class="transaction">
                <input type="number" id="amount" placeholder="Enter amount">

                <button onclick="depositMoney()">Deposit</button>
                <button onclick="withdrawMoney()">Withdraw</button>
            </div>

            <p id="message"></p>

        </div>

    </div>

    <script src="P-3 script.js"></script>
</body>
</html>
